<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 時代企業行銷策略｜現場講解版</title>
<!--
  10/29 演講現場講解版：投影片＋要講的話＋示範步驟＋背景資料，全部在這一個檔。
  每一頁 = 一個 <section class="slide">：前半是投影片畫面，<aside class="notes"> 是講者才看得到的內容。
  背景資料與貼上包在最下方 <div id="library">，各頁用 data-bg 引用。
  這個檔由 _build/現場講解版/build_live.py 產生；要改內容請改來源再重跑。
-->
<style>
:root{
  --paper:#F7F3EA;--card:#FFFDF8;--ink:#1E1B18;--grey:#5A5E63;--line:#DCCFB6;
  --moss:#2E5A36;--deep:#1D3B24;--caramel:#B7802F;--caramel-l:#E2B565;--red:#B8432F;
  --moss-t:#E2EBDD;--caramel-t:#F3E3C3;--red-t:#F6E1D9;--say:#F3EAD8;
  --num:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;
  --fs:26px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif}
body{overflow:hidden}
button{font:inherit;font-size:16px;padding:6px 12px;color:var(--moss);background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--moss)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
kbd{font:.8em/1 Consolas,monospace;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#fff}

/* ================= 投影片（1280×720 舞台，大講堂字級） ================= */
.view{position:relative;overflow:hidden;background:var(--paper)}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.slide{display:none;position:absolute;inset:0;width:1280px;height:720px;overflow:hidden}
.slide.active{display:block}
.slide aside.notes{display:none}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.fr{position:absolute;inset:0;display:flex;flex-direction:column;padding:38px 64px 24px;background:var(--paper);color:var(--ink)}
.hd{position:relative;flex:0 0 auto}
.kick{display:flex;align-items:center;gap:12px;height:36px;font-size:25px;font-weight:700;color:var(--caramel);letter-spacing:.08em}
.kick::before{content:"";width:32px;height:5px;border-radius:3px;background:currentColor}
.hr{position:absolute;right:0;top:0;display:flex;align-items:center}
.tt{margin:6px 0 0;font-size:60px;line-height:1.2;font-weight:700;color:var(--moss);white-space:nowrap;display:flex;align-items:center;gap:26px}
.bd{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:safe center;gap:26px;padding:16px 0 10px}
.ft{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:21px;color:var(--grey)}
.ft b{font-family:var(--num);font-weight:600;font-size:28px;color:var(--caramel);letter-spacing:.04em}
.prog{position:absolute;left:0;bottom:0;height:7px;width:calc(var(--p)*100%);background:var(--caramel)}
.fr.dark{background:var(--deep);color:#F4EFE3}
.dark .kick{color:var(--caramel-l)}.dark .ft{color:#AEBBAA}.dark .ft b{color:var(--caramel-l)}

/* 卡片、流程 */
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:30px 30px 34px;box-shadow:0 20px 34px -28px rgba(30,27,24,.6)}
.card>.ic{display:block;font-size:84px;color:var(--moss);margin-bottom:20px}
.card p{margin:0;font-size:40px;line-height:1.3;font-weight:700}
.card p .h{display:block;font-size:48px;color:var(--moss)}
.card p small{display:block;margin-top:10px;font-size:33px;line-height:1.35;font-weight:700;color:var(--ink)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr) 56px minmax(0,1fr);align-items:stretch}
.arw{display:grid;place-items:center;color:var(--caramel)}
.arw svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.role{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;color:var(--caramel);margin-bottom:22px}
.role .av{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--caramel);color:#fff;font-size:40px}
.role.ai{color:var(--moss)}.role.ai .av{background:var(--moss)}
.live{display:inline-flex;align-items:center;gap:12px;font-size:28px;font-weight:700;color:#fff;background:var(--red);padding:8px 22px 8px 18px;border-radius:999px;letter-spacing:.06em}
.live i{width:16px;height:16px;border-radius:50%;background:#fff}

/* 對話泡泡 */
.chat{display:flex;flex-direction:column;gap:36px}
.msg{display:flex;align-items:flex-end;gap:24px}
.msg.r{flex-direction:row-reverse}
.who2{flex:0 0 auto;width:124px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:25px;font-weight:700;color:var(--grey)}
.who2 .av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--caramel);color:#fff;font-size:52px}
.msg.r .who2 .av{background:var(--moss)}
.bub{font-size:48px;line-height:1.3;font-weight:700;padding:30px 42px;border-radius:36px 36px 36px 8px;background:var(--card);border:2px solid var(--line);box-shadow:0 20px 34px -28px rgba(30,27,24,.6)}
.msg.r .bub{border-radius:36px 36px 8px 36px;background:var(--moss);border-color:var(--moss);color:#fff}

/* 長條圖 */
.bars2{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.bars h3{display:flex;align-items:baseline;gap:12px;margin:0 0 6px;font-size:36px}
.bars h3 small{font-size:26px;color:var(--grey)}
.bar{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:12px;margin:18px 0}
.bar>b{font-family:var(--num);font-weight:600;font-size:52px}
.tr{position:relative;height:70px;background:rgba(30,27,24,.05);border-radius:0 14px 14px 0}
.tr i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v)*100%);border-radius:0 14px 14px 0;transform-origin:left center}
.tr em{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--v)*100% + 14px);font-style:normal;font-family:var(--num);font-weight:600;font-size:44px;white-space:nowrap}
.tr em.in{left:auto;right:calc((1 - var(--v))*100% + 16px);color:#fff}
.take{margin:0;text-align:center;font-size:40px;font-weight:700}
.take mark{background:var(--caramel-t);color:var(--ink);padding:4px 22px;border-radius:12px}

/* 優惠券 */
.tks{display:flex;flex-direction:column;gap:20px}
.tk{position:relative;display:grid;grid-template-columns:128px minmax(0,1fr) auto;align-items:center;min-height:116px;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 18px 30px -26px rgba(30,27,24,.7)}
.tk::before,.tk::after{content:"";position:absolute;left:114px;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.tk::before{top:-16px}.tk::after{bottom:-16px}
.tk .stb{align-self:stretch;display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:70px;color:#fff;background:var(--moss);border-radius:18px 0 0 18px;border-right:4px dashed var(--paper)}
.tk .tx{padding:6px 30px}
.tk .nm{font-size:25px;font-weight:700;color:var(--caramel)}
.tk .st{font-size:34px;font-weight:700;line-height:1.2}
.tk .fm{margin-top:3px;font-size:23px;font-weight:400;line-height:1.25;color:var(--grey)}
.tks{gap:12px}
.tks+.warn{padding:10px 26px;font-size:32px}
/* 第 7 頁：三次活動紀錄表 */
.hist th small{font-size:.7em;font-weight:400;margin-left:6px;opacity:.85}
.hist th,.hist td{white-space:nowrap}
.hist th{padding:12px 14px}
.hist td{padding:11px 14px;vertical-align:middle;line-height:1.3}
.hist td .lt{display:inline-grid;place-items:center;width:52px;height:52px;margin-right:14px;border-radius:12px;background:var(--moss);color:#fff;font-family:var(--num);font-weight:600;font-size:34px;vertical-align:middle}
.hist td.hi{color:var(--moss)}
.tk .nu{padding:0 36px;text-align:right;line-height:1}
.tk .nu b{font-family:var(--num);font-weight:600;font-size:64px;color:var(--moss)}
.tk .nu small{display:block;margin-top:6px;font-size:24px;font-weight:700;color:var(--grey)}
.warn{display:flex;align-items:center;gap:18px;font-size:36px;font-weight:700;color:var(--red);background:var(--red-t);padding:16px 30px;border-radius:18px}
.warn .ic{font-size:48px}

/* 印章：標出事實／假設／待核准 */
.stamp{display:inline-block;font-size:28px;font-weight:700;letter-spacing:.14em;padding:2px 12px 2px 16px;border:4px solid currentColor;border-radius:10px;color:var(--red);background:rgba(255,253,248,.75);transform:rotate(-7deg);white-space:nowrap;line-height:1.35}
.stamp.m{color:var(--moss)}.stamp.c{color:var(--caramel)}

/* 數字階梯 */
.ladder{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr) 52px minmax(0,1.2fr);align-items:stretch}
.lad{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:26px;padding:28px 14px}
.lad .lb{font-size:32px;font-weight:700;color:var(--grey)}
.lad .bg{font-family:var(--num);font-weight:600;font-size:128px;line-height:1;color:var(--moss);margin:14px 0 8px}
.lad:first-child .bg{color:var(--caramel)}
.lad .un{font-size:32px;font-weight:700;line-height:1.35}
.lad .mi{display:flex;align-items:baseline;gap:12px;margin:2px 0}
.lad .mi b{font-family:var(--num);font-weight:600;font-size:72px;line-height:1.05;color:var(--moss)}
.lad .mi span{font-size:30px;font-weight:700}
.lad .stamp{position:absolute;top:-22px;right:-6px}
.lad .how{margin-top:10px;font-size:23px;font-weight:700;line-height:1.3;color:var(--grey)}
.call .how{margin:10px 0 14px;font-size:27px;font-weight:700;line-height:1.4;color:#DCE7D6;font-variant-numeric:tabular-nums}

/* 收據 */
.rcp{display:grid;grid-template-columns:540px minmax(0,1fr);gap:60px;align-items:center}
.rc-w{filter:drop-shadow(0 16px 16px rgba(30,27,24,.2))}
.rc{background:#fff;padding:26px 40px 50px}
.rc .rh{display:flex;justify-content:space-between;align-items:center;font-size:29px;font-weight:700;padding-bottom:12px;border-bottom:3px dashed var(--line);margin-bottom:8px}
.rc .rh .stamp{font-size:24px}
.rc .li{display:flex;align-items:baseline;gap:12px;font-size:36px;font-weight:700;line-height:1.55}
.rc .li i{flex:1;border-bottom:4px dotted #CDBF9F;transform:translateY(-10px)}
.rc .li b{font-family:var(--num);font-weight:600;font-size:40px}
.rc .li.sum{border-top:4px solid var(--ink);margin-top:8px;padding-top:4px}
.rc .li.mut{color:var(--grey)}
.call{position:relative;background:var(--moss);color:#fff;border-radius:28px;padding:36px 44px}
.call .lb{font-size:34px;font-weight:700;color:#DCE7D6}
.call .lb2{font-size:40px;font-weight:700;margin-top:8px}
.call .bg{font-family:var(--num);font-weight:600;font-size:128px;line-height:1.05}
.call .bg small{font-family:inherit;font-size:44px;margin-left:10px}
.call .stamp{position:absolute;right:30px;top:30px;color:#FFD3C2;background:transparent;font-size:34px}

/* 確定程度 */
.cert{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700;color:var(--grey);padding:0 10px}
.cert i{flex:1;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--moss))}

/* 列表 */
.rows{display:flex;flex-direction:column;gap:26px}
.rw{display:flex;align-items:center;gap:28px;font-size:44px;font-weight:700;line-height:1.3}
.rw .ib{flex:0 0 auto;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:var(--moss-t);color:var(--moss);font-size:54px}
.rw .stamp{margin-left:auto;font-size:32px}
.rw.a{font-size:40px}.rw.a .ib{background:var(--red-t);color:var(--red)}
.rw.sm{font-size:30px;gap:22px;font-weight:400;line-height:1.4}
.rw.sm .ib{width:64px;height:64px;border-radius:18px;font-size:36px}
.rw.sm b{color:var(--moss)}
.rows:has(.sm){gap:16px}

/* 時間軸 */
.tags{display:flex;justify-content:center;align-items:center;gap:16px;font-size:42px;font-weight:700}
.tags span{padding:6px 28px;border-radius:999px;background:var(--moss);color:#fff}
.tags em{font-style:normal;margin-left:12px}
.tl{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}
.tl::before{content:"";position:absolute;left:16.7%;right:16.7%;top:106px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--moss) 0 50%,var(--caramel) 50% 100%)}
.pt{position:relative;text-align:center}
.pt .d{font-family:var(--num);font-weight:600;font-size:76px;line-height:1;height:80px}
.pt .dot{position:relative;z-index:1;width:44px;height:44px;margin:10px auto 16px;border-radius:50%;background:var(--moss);border:8px solid var(--paper);box-shadow:0 0 0 4px var(--moss)}
.pt.hi .d{color:var(--caramel)}.pt.hi .dot{background:var(--caramel);box-shadow:0 0 0 4px var(--caramel)}
.pt p{margin:0;font-size:34px;font-weight:700;line-height:1.35}
/* 第 2 頁自我介紹：五段經歷的時間軸＋三個數字 */
.me{display:flex;flex-direction:column;gap:34px}
.me .tl{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:0}
.me .tl::before{left:10%;right:10%;top:70px;height:6px;background:linear-gradient(90deg,var(--moss) 0 78%,var(--caramel) 78% 100%)}
.me .pt .d{font-family:inherit;font-weight:700;font-size:40px;line-height:1.1;height:48px;color:var(--moss)}
.me .pt .dot{width:34px;height:34px;margin:8px auto 14px;border-width:6px}
.me .pt p{font-size:26px;font-weight:400;line-height:1.3;color:var(--grey)}
.me .now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.me .now>div{display:flex;align-items:center;gap:16px;padding:20px 20px;background:var(--card);border:2px solid var(--line);border-radius:22px;font-size:27px;font-weight:700;line-height:1.3;white-space:nowrap;box-shadow:0 20px 34px -28px rgba(30,27,24,.6)}
.me .now b{flex:0 0 auto;font-family:var(--num);font-weight:600;font-size:64px;line-height:1;color:var(--moss)}
.me .now b small{font-family:"Microsoft JhengHei","微軟正黑體",sans-serif;font-weight:700;font-size:24px;margin-left:3px}

/* 三明治 */
.sand{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:20px;align-items:center}
.lys{display:flex;flex-direction:column;gap:12px}
.ly{display:flex;align-items:center;gap:18px;min-height:110px;padding:0 44px;font-size:40px;font-weight:700}
.ly b{flex:0 0 auto;font-size:46px}
.ly.br{background:#E9CD94;color:#3B2A1E}
.ly.t{border-radius:80px 80px 18px 18px}
.ly.b{border-radius:18px 18px 80px 80px}
.ly.f{margin:0 24px;border-radius:16px;background:var(--moss);color:#fff}
.loop svg{display:block;width:170px;height:350px;fill:none;stroke:var(--caramel);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}

/* 雙卡 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.duo .card{min-height:310px;display:flex;flex-direction:column;justify-content:center}
.duo .card p{font-size:46px}
.duo .card.hi{border-color:var(--caramel);background:#FFF7E8}
.duo .card.hi>.ic{color:var(--caramel)}
.qm{position:absolute;right:34px;top:0;font-family:var(--num);font-weight:600;font-size:200px;line-height:1;color:var(--caramel-t)}

/* 標籤條（三區塊、五項能力） */
.chips{display:flex;gap:10px}
.chips span{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;padding:5px 16px;border-radius:999px;border:2px solid var(--line);color:var(--grey);background:var(--card)}
.chips span.on{background:var(--moss);border-color:var(--moss);color:#fff}
.chips .ic{font-size:24px}
.skl{display:grid;grid-template-columns:250px minmax(0,1fr);gap:64px;align-items:center}
.disc{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;background:var(--moss);color:#fff;font-size:126px;box-shadow:0 0 0 16px var(--moss-t)}
.blt{display:flex;flex-direction:column;gap:28px}
.blt p{margin:0;display:flex;align-items:center;gap:22px;font-size:44px;font-weight:700;line-height:1.3}
.blt p::before{content:"";flex:0 0 auto;width:20px;height:20px;border-radius:5px;background:var(--caramel);transform:rotate(45deg)}
.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.five>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:320px;padding:30px 12px;text-align:center;font-size:38px;font-weight:700;line-height:1.3;background:var(--card);border:2px solid var(--line);border-radius:26px}
.five .ib{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:var(--moss);color:#fff;font-size:62px}

/* 大字頁 */
.stm{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center}
.stm h2{position:relative;margin:0;font-size:88px;line-height:1.25;font-weight:700}
.stm h2 em{font-style:normal;color:var(--caramel-l)}
.stm p{position:relative;margin:34px 0 0;font-size:42px;font-weight:700;color:#CBD6C7}
.ghost{position:absolute;right:-30px;top:50%;transform:translateY(-52%);font-family:var(--num);font-weight:600;font-size:600px;line-height:1;color:rgba(255,255,255,.07)}

/* 封面 */
.cov{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:30px;align-items:center;height:100%}
.cov h1{margin:0;font-size:108px;line-height:1.14;font-weight:700;color:var(--moss)}
.cov h1 span{color:var(--caramel)}
.cov .who{display:flex;align-items:center;gap:16px;margin:44px 0 0;font-size:48px;font-weight:700}
.cov .who .ic{color:var(--caramel)}
.etk{position:relative;background:var(--moss);color:#fff;border-radius:30px;padding:46px 42px 38px;transform:rotate(3deg);box-shadow:0 34px 40px -30px rgba(0,0,0,.65)}
.etk::before,.etk::after{content:"";position:absolute;bottom:108px;width:40px;height:40px;border-radius:50%;background:var(--paper)}
.etk::before{left:-20px}.etk::after{right:-20px}
.etk .d{font-family:var(--num);font-weight:600;font-size:78px;line-height:1}
.etk .t{font-family:var(--num);font-weight:400;font-size:52px;margin-top:14px;color:#DCE7D6}
.etk .p{display:flex;align-items:center;gap:16px;margin-top:48px;padding-top:30px;border-top:4px dashed rgba(255,255,255,.45);font-size:42px;font-weight:700}
.etk .p .ic{font-size:50px;color:var(--caramel-l)}

/* 咖啡店 */
.cup{display:block}
.case{display:grid;grid-template-columns:400px minmax(0,1fr);gap:50px;align-items:center}
.shop{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:18px 20px 30px}
.shop .cup{width:220px;height:220px;margin:0 auto}
.shop h3{margin:0;font-size:64px;color:var(--moss)}
.shop p{margin:6px 0 0;font-size:32px;font-weight:700;color:var(--grey)}
.goal{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700}
.goal .ic{font-size:56px;color:var(--moss)}
.menu{margin-top:16px;font-size:29px;font-weight:700;line-height:1.45;color:var(--grey)}
.ask{margin-top:22px;background:var(--caramel-t);border-radius:26px;padding:20px 34px}
.card p em{display:block;margin-top:10px;font-style:normal;font-size:30px;line-height:1.3;color:var(--caramel)}
.ask .lb{font-size:32px;font-weight:700;color:var(--caramel)}
.ask .ns{display:flex;gap:50px;margin-top:6px}
.ask .ns div{display:flex;align-items:baseline;gap:10px}
.ask .ns b{font-family:var(--num);font-weight:600;font-size:104px;line-height:1}
.ask .ns span{font-size:36px;font-weight:700}

/* 休息 */
.brk{display:grid;grid-template-columns:380px minmax(0,1fr);gap:64px;align-items:center;height:100%}
.brk .cup{width:380px;height:380px}
.brk h2{margin:0;font-size:84px;color:var(--moss)}
.brk .back{display:flex;align-items:baseline;gap:20px;margin-top:12px}
.brk .back b{font-family:var(--num);font-weight:600;font-size:160px;line-height:1;color:var(--caramel)}
.brk .back span{font-size:56px;font-weight:700}
.brk p{margin:22px 0 0;font-size:38px;font-weight:700;color:var(--grey)}

/* Q&A */
.qa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:center;height:100%}
.qa .q{font-family:var(--num);font-weight:600;font-size:176px;line-height:1;color:var(--caramel-l)}
.qa .qs{display:flex;flex-direction:column;gap:26px}
.qa .qs div{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:700;line-height:1.3;background:rgba(255,255,255,.08);border-radius:24px;padding:26px 30px}
.qa .ic{font-size:50px;color:var(--caramel-l)}

/* 圖片＋文字 */
.ims{display:grid;grid-template-columns:auto minmax(0,1fr);gap:50px;align-items:center}
.ims img{display:block;border-radius:20px;background:#fff;box-shadow:0 22px 34px -26px rgba(0,0,0,.7)}
/* 圖放大：按 Z 或點圖，整張圖撐滿舞台高度；再按一次縮回 */
.slide .zoomable{cursor:zoom-in}
.slide.zoom::after{content:"";position:absolute;inset:0;background:rgba(30,27,24,.6);z-index:4}
.slide.zoom .zoomable{position:fixed;left:50%;top:50%;height:700px!important;width:auto;transform:translate(-50%,-50%)!important;animation:none!important;z-index:5;cursor:zoom-out;border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.quote{font-size:48px;font-weight:700;line-height:1.45;padding-left:34px;border-left:12px solid var(--caramel)}
.quote em{font-style:normal;color:var(--red)}

/* 附錄數字卡 */
.stat .card{text-align:left}
.stat .bg{font-family:var(--num);font-weight:600;font-size:96px;line-height:1;color:var(--moss);margin-bottom:18px}
.stat .bg small{font-family:"Microsoft JhengHei",sans-serif;font-size:36px;margin-left:8px}
.stat p{font-size:36px}

/* 預備示例：表格、步驟、文案 */
.tb{width:100%;border-collapse:separate;border-spacing:0;line-height:1.3;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.tb th{background:var(--moss);color:#fff;text-align:left;padding:14px 18px;font-size:.9em}
.tb td{padding:12px 18px;border-top:2px solid var(--line);vertical-align:top}
.tb .num{text-align:right}
.tb.dense th{padding:9px 12px}.tb.dense td{padding:7px 12px}
.tb td.num{font-family:var(--num);font-weight:600;font-size:1.15em}
.fine{margin:0;font-size:25px;line-height:1.45;color:var(--grey);font-weight:700}
.steps2{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps2 p{margin:0;display:grid;grid-template-columns:54px minmax(0,1fr);gap:18px;align-items:start;font-size:31px;line-height:1.4}
.steps2 p::before{counter-increment:s;content:counter(s);width:50px;height:50px;border-radius:50%;background:var(--moss);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:30px}
.steps2 b{color:var(--moss)}
.cpy{background:#fff;border-left:12px solid var(--caramel);border-radius:0 20px 20px 0;padding:22px 32px;font-size:32px;line-height:1.5}
.cpy .lb{font-size:25px;font-weight:700;color:var(--caramel)}
.faq{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.faq li{font-size:28px;line-height:1.45}
.faq b{color:var(--moss);margin-right:8px}

/* 動態：只在換到這一頁時跑一次 */
@media (prefers-reduced-motion:no-preference){
  .slide.active .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*110ms)}
  .slide.active .bar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*120ms + 200ms)}
  .slide.active .bar em{animation:fade .4s ease both;animation-delay:calc(var(--d,0)*120ms + 800ms)}
  .slide.active .steam path{animation:steam 3.2s ease-in-out infinite}
  .slide.active .steam path:nth-child(2){animation-delay:-1s}
  .slide.active .steam path:nth-child(3){animation-delay:-2s}
  .slide.active .live i{animation:blink 1.4s ease-in-out infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0}}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-10px);opacity:.45}}
@keyframes blink{50%{opacity:.25}}

/* ================= 講者畫面（老花友善：投影片縮小、講稿放大） ================= */
body.presenter{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.6fr);grid-template-rows:auto minmax(0,1fr)}
#bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--moss);color:#fff}
#bar .clock{font-family:var(--num);font-size:36px;font-weight:600;line-height:1}
#bar .chip{font-size:19px;font-weight:700;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.16)}
#bar .chip.late{background:#C0632B}
#bar .chip.early{background:#3F7A4A}
#bar .page{font-family:var(--num);font-size:26px;font-weight:600}
#bar .sp{flex:1}
#bar button{font-size:15px;padding:4px 9px}
#btnAud.on{background:#DCEFD9}#btnAud.on::after{content:" ●";color:#2F8A3E}
#bar .fsz{font-weight:700;min-width:44px}
#bar select{font-family:inherit;font-size:15px;padding:4px;max-width:150px;border-radius:8px;border:1px solid var(--line)}
#left{display:flex;flex-direction:column;gap:12px;padding:12px;min-height:0;min-width:0;overflow:hidden}
#mainView{flex:0 0 auto;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 12px rgba(46,90,54,.1)}
#nextWrap{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
#nextView{width:62%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px}
#nextLabel{font-size:18px;color:var(--grey);line-height:1.45}
#nextLabel b{display:block;color:var(--ink);font-size:21px}
#panel{overflow:auto;padding:16px 24px 60px;background:var(--card);border-left:1px solid var(--line);font-size:var(--fs);line-height:1.65}
#panel .ph{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--caramel);font-weight:700;font-size:.7em}
#panel h2{margin:4px 0 12px;font-size:1.25em;line-height:1.3;color:var(--moss)}
#panel h3{margin:20px 0 6px;font-size:.68em;color:var(--caramel);letter-spacing:.06em}
.say-block p{margin:0 0 .65em}
.say-block h4.lbl{margin:.9em 0 .3em;font-size:.72em;color:var(--caramel);letter-spacing:.06em}
.say-block h4.lbl:first-child{margin-top:0}
.say-block p.cue{color:var(--grey);font-size:.82em;border-left:4px solid var(--caramel-l);padding-left:.55em;background:#fff}
.demo{margin-top:16px;padding:12px 18px 14px;border:3px solid var(--moss);border-radius:12px;background:#fff}
.demo h3{margin-top:2px!important;color:var(--moss)!important;font-size:.8em!important}
.steps{margin:0;padding-left:1.4em}
.steps>li{margin:0 0 .7em;padding:2px 4px;border-radius:6px;cursor:pointer}
.steps>li.done{opacity:.4;text-decoration:line-through}
.steps small{display:block;color:var(--grey);font-size:.75em;line-height:1.55;margin-top:2px}
/* 逐輪對話：我說／EVA 大概會答／我接著 */
.rd{display:grid;gap:6px;margin:2px 0 4px}
.rd>div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:.4em;align-items:start;line-height:1.5}
.rd>div>b{font-size:.72em;padding:.25em .5em;border-radius:6px;text-align:center;white-space:nowrap;margin-top:.25em}
.rd .me>b{background:var(--caramel);color:#fff}
.rd .ai>b{background:var(--moss-t);color:var(--moss)}
.rd .ai{color:var(--deep);font-size:.9em}
.rd .fx>b{background:var(--red-t);color:var(--red)}
.rd .fx{font-size:.9em}
.rd .copy{margin-left:6px}
.say{background:var(--say);padding:1px 6px;border-radius:4px;font-weight:700;color:#3D2A10}
.copy{margin:2px 0 2px 8px;font-size:max(15px,.6em);padding:3px 10px;vertical-align:middle}
.copy.ok{background:var(--moss);color:#fff;border-color:var(--moss)}
.copy.bad{background:var(--red);color:#fff}
.branch{margin-top:10px;padding:10px 14px;background:#FBF1EC;border-left:5px solid var(--red);font-size:.82em;line-height:1.6}
.branch ul{margin:4px 0 0;padding-left:1.2em}
.jump{background:var(--red);color:#fff;border-color:var(--red);font-size:max(15px,.65em)}
.bgs details{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
.bgs summary{padding:8px 12px;cursor:pointer;font-weight:700;color:var(--moss);font-size:.72em}
.bgs details>div{padding:4px 14px 12px;font-size:.68em;line-height:1.6}

/* 資料表、貼上包（面板、資料抽屜、列印共用） */
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;font-size:.95em;width:100%}
.tw th,.tw td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{color:var(--moss);white-space:nowrap}
.tw td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
pre.pack{white-space:pre-wrap;font-family:inherit;font-size:.95em;line-height:1.6;background:#F6F1E6;padding:10px;border-radius:6px;max-height:340px;overflow:auto;margin:6px 0}
.src{color:var(--grey);font-size:.9em;font-weight:700}
h5{margin:12px 0 4px;color:var(--caramel);font-size:1em}

/* 資料抽屜 */
#drawer{position:fixed;inset:0 0 0 auto;width:min(900px,96vw);background:var(--card);border-left:3px solid var(--moss);box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s;z-index:50;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--moss);color:#fff}
#drawer header b{flex:1;font-size:22px}
#toc{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:calc(var(--fs)*.68)}
#toc a{color:var(--moss)}
#library{overflow:auto;padding:4px 22px 60px;font-size:calc(var(--fs)*.78);line-height:1.7}
#library article{border-top:1px solid var(--line);padding-top:6px;margin-top:18px}
#library h4{margin:6px 0;color:var(--moss);font-size:1.2em}
ul.check{list-style:none;padding-left:0}
ul.check li{margin:6px 0}
ul.check input{transform:scale(1.4);margin-right:8px}

/* 只看投影片：觀眾視窗 或 鏡像時按 N */
body.audience,body.solo{display:block}
body.audience #bar,body.audience #panel,body.audience #nextWrap,body.solo #bar,body.solo #panel,body.solo #nextWrap{display:none}
body.audience #left,body.solo #left{position:fixed;inset:0;padding:0}
body.audience #mainView,body.solo #mainView{border:0;border-radius:0;box-shadow:none;height:100%;aspect-ratio:auto}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:.92}
#printAll{display:none}

@media print{
  @page{size:A4;margin:14mm}
  html,body{height:auto;overflow:visible;background:#fff}
  body.presenter{display:block}
  #bar,#left,#panel,#drawer,#toast{display:none!important}
  #printAll{display:block;font-size:12.5pt;line-height:1.6}
  #printAll .pp{break-inside:avoid-page;border-top:1px solid #999;padding-top:6px;margin-top:10px}
  #printAll h2{font-size:15pt;margin:2px 0;color:var(--moss)}
  #printAll .ph{color:var(--caramel);font-size:10pt;font-weight:700}
  #printAll .demo{border:1px solid var(--moss)}
  #printAll .copy,#printAll .jump{display:none}
  #printAll pre.pack{max-height:none;font-size:10pt}
  #printAll article{break-before:page}
  #printAll article:first-of-type{break-before:auto}
}
</style>

<body>
<div id="bar">
  <span class="clock" id="clock">--:--</span>
  <span class="chip" id="slot">—</span>
  <span class="page" id="page">1 / 35</span>
  <button id="btnReturn" hidden>↩ 回第 <span></span> 頁（R）</button>
  <span class="sp"></span>
  <select id="jumpSel" aria-label="跳到某一頁"></select>
  <button id="btnPrev" title="上一頁（←）">←</button>
  <button id="btnNext" title="下一頁（→）">→</button>
  <button class="fsz" id="btnFsDown" title="講稿字變小（-）">字−</button>
  <button class="fsz" id="btnFsUp" title="講稿字變大（+）">字＋</button>
  <button id="btnAud" title="開投影視窗（O）">投影視窗</button>
  <button id="btnSolo" title="只看投影片（N）">只看投影片</button>
  <button id="btnData" title="全部資料（D）">資料</button>
  <button id="btnCheck" title="開場前檢查（C）">檢查</button>
</div>
<div id="left">
  <div class="view" id="mainView"><div class="stage" id="deck">
<!--DECK-->
  </div></div>
  <div id="nextWrap"><div id="nextLabel"></div><div class="view" id="nextView"><div class="stage" id="nextStage"></div></div></div>
</div>
<div id="panel" aria-live="polite"></div>

<div id="drawer" aria-hidden="true">
  <header><b>全部資料（只有講者看得到）</b><button id="btnPrint" title="列印整份講稿與資料">列印講稿</button><button id="btnClose">關閉（Esc）</button></header>
  <nav id="toc"><!--TOC--></nav>
  <div id="library"><!--LIBRARY--></div>
</div>
<div id="printAll"></div>
<div id="toast"></div>

<script>
/*IMG*/
(() => {
  const AUD = new URLSearchParams(location.search).get('view') === 'audience';
  document.body.classList.add(AUD ? 'audience' : 'presenter');
  document.querySelectorAll('img[data-img]').forEach(im => { im.src = IMG[im.dataset.img] });

  const $ = s => document.querySelector(s);
  const slides = [...document.querySelectorAll('#deck > .slide')];
  const MAIN_LAST = 34;            // 第 35 頁 Q&A；之後是附錄與預備示例
  let n = 0, returnTo = null, aud = null;

  // ---------- 縮放 ----------
  function fit(view, stage) {
    const r = view.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const s = Math.min(r.width / 1280, r.height / 720);
    stage.style.transform = `translate(${(r.width - 1280 * s) / 2}px,${(r.height - 720 * s) / 2}px) scale(${s})`;
  }
  function fitAll() { fit($('#mainView'), $('#deck')); if (!AUD) fit($('#nextView'), $('#nextStage')); }
  addEventListener('resize', fitAll);
  new ResizeObserver(fitAll).observe($('#mainView'));

  // ---------- 換頁 ----------
  function show(i) {
    n = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => { s.classList.toggle('active', k === n); s.classList.remove('zoom'); });
    zoom = false;
    try { history.replaceState(null, '', (AUD ? '?view=audience' : location.pathname) + '#' + (n + 1)); } catch (e) {}
    document.title = (n + 1) + '｜AI 時代企業行銷策略' + (AUD ? '' : '（講者）');
    if (n <= MAIN_LAST) returnTo = null;
    if (!AUD) { renderPanel(); renderNext(); updateBar(); sendAud(); }
  }
  // 圖放大（第 26 頁圖表）：按 Z 或點圖，兩個視窗同步
  let zoom = false;
  function setZoom(on) {
    if (!slides[n].querySelector('.zoomable')) return false;
    zoom = on; slides[n].classList.toggle('zoom', on);
    if (!AUD) sendAud();
    return true;
  }
  addEventListener('click', e => {
    if (!e.target.closest('.slide.active .zoomable')) return;
    if (AUD && window.opener && !window.opener.closed) window.opener.postMessage({ t: 'key', k: 'z' }, '*');
    else setZoom(!zoom);
  });
  function go(d) { show(n <= MAIN_LAST ? Math.min(MAIN_LAST, n + d) : n + d); }
  function jump(no) { if (n <= MAIN_LAST) returnTo = n; show(no - 1); if (n <= MAIN_LAST) returnTo = null; updateBar(); }
  function back() { if (returnTo !== null) { const r = returnTo; returnTo = null; show(r); } }

  // ---------- 講者面板 ----------
  const lib = id => document.getElementById(id);
  function panelHTML(s, forPrint) {
    const d = s.dataset, a = s.querySelector('aside.notes');
    const bg = (a.dataset.bg || '').split(' ').filter(Boolean).map(id => {
      const art = lib(id); if (!art) return '';
      const body = art.cloneNode(true); body.querySelector('h4').remove();
      return `<details${forPrint ? ' open' : ''}><summary>${art.dataset.title}</summary><div>${body.innerHTML}</div></details>`;
    }).join('');
    const no = +d.no;
    return `<div class="ph"><span>第 ${no} 頁${no > 35 ? '｜附錄' : ''}</span><span>${d.time}</span></div>
      <h2>${d.title}</h2>
      <h3>要講的話</h3>${a.innerHTML}
      ${bg ? `<div class="bgs"><h3>背景資料（點開看）</h3>${bg}</div>` : ''}`;
  }
  function renderPanel() { const p = $('#panel'); p.innerHTML = panelHTML(slides[n]); p.scrollTop = 0; }
  function nextIndex() { return n < MAIN_LAST ? n + 1 : n === MAIN_LAST ? null : (n + 1 < slides.length ? n + 1 : null); }
  function renderNext() {
    const st = $('#nextStage'), k = nextIndex(); st.innerHTML = '';
    if (k === null) { $('#nextLabel').innerHTML = n === MAIN_LAST ? '<b>正式流程到此結束</b>附錄按 A' : '<b>最後一頁</b>'; return; }
    const c = slides[k].cloneNode(true); c.classList.add('active'); c.querySelector('aside')?.remove(); st.appendChild(c);
    $('#nextLabel').innerHTML = `下一頁<b>${k + 1}｜${slides[k].dataset.title}</b>`;
    fit($('#nextView'), st);
  }

  // ---------- 上方資訊列 ----------
  const pad = x => String(x).padStart(2, '0');
  const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  function audOn() { $('#btnAud').classList.toggle('on', !!(aud && !aud.closed)); }
  function updateBar() {
    const no = n + 1;
    $('#page').textContent = no <= 35 ? `${no} / 35` : `附錄 ${no}`;
    const rb = $('#btnReturn'); rb.hidden = returnTo === null; if (returnTo !== null) rb.querySelector('span').textContent = returnTo + 1;
    $('#jumpSel').value = String(n);
    audOn();
    tick();
  }
  function tick() {
    const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    $('#clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    const t = slides[n].dataset.time, m = t.match(/(\d\d:\d\d)–(\d\d:\d\d)/), chip = $('#slot');
    chip.className = 'chip';
    if (!m) { chip.textContent = t; return; }
    const a = mins(m[1]), b = mins(m[2]);
    let txt = '本頁 ' + t;
    const today = d.getFullYear() === 2026 && d.getMonth() === 9 && d.getDate() === 29;
    if (today && now >= 9 * 60 && now <= 12 * 60 + 10) {   // 只在 10/29 演講時段顯示快慢
      txt = `本頁 ${m[1]}–${m[2]}`;
      if (now >= b) { txt += `｜落後 ${now - b + 1} 分`; chip.classList.add('late'); }
      else if (now < a) { txt += `｜超前 ${a - now} 分`; chip.classList.add('early'); }
      else txt += `｜剩 ${b - now} 分`;
    }
    chip.textContent = txt;
  }
  setInterval(() => { if (!AUD) { tick(); audOn(); } }, 5000);

  // ---------- 投影視窗同步 ----------
  function sendAud() { if (aud && !aud.closed) aud.postMessage({ t: 'go', n, zoom }, '*'); }
  function openAud() {
    const url = location.href.split('#')[0].split('?')[0] + '?view=audience#' + (n + 1);
    aud = window.open(url, 'zell-audience', 'popup=yes,width=1280,height=760');
    if (!aud) toast('瀏覽器擋了彈出視窗，請允許後再按一次');
    setTimeout(sendAud, 800); updateBar();
  }
  addEventListener('message', e => {
    const d = e.data || {};
    if (AUD) { if (d.t === 'go' && e.source === window.opener) { show(d.n); if (d.zoom) setZoom(true); } return; }
    if (d.t === 'hello') { aud = e.source; sendAud(); updateBar(); }
    if (d.t === 'key' && e.source === aud) key(d.k);
  });
  if (AUD && window.opener) window.opener.postMessage({ t: 'hello' }, '*');

  // ---------- 講稿字級（存在本機） ----------
  let fs = 26;
  try { fs = +localStorage.getItem('zell-1029-fs') || 26; } catch (e) {}
  function setFs(v) {
    fs = Math.max(18, Math.min(48, v));
    document.documentElement.style.setProperty('--fs', fs + 'px');
    try { localStorage.setItem('zell-1029-fs', fs); } catch (e) {}
  }
  setFs(fs);

  // ---------- 鍵盤 ----------
  function key(k) {
    const K = k.length === 1 ? k.toLowerCase() : k;
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(K)) go(1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(K)) go(-1);
    else if (K === 'Home') show(0);
    else if (K === 'End') show(MAIN_LAST);
    else if (K === 'a') jump(36);
    else if (K === 'r') back();
    else if (K === 'z') return setZoom(!zoom);
    else if (K === 'Escape' && zoom) setZoom(false);
    else if (AUD) return false;
    else if (K === 'n') document.body.classList.toggle('solo'), fitAll();
    else if (K === 'o') openAud();
    else if (K === 'd') drawer();
    else if (K === 'c') drawer('lib-check');
    else if (K === '=' || K === '+') setFs(fs + 2);
    else if (K === '-') setFs(fs - 2);
    else if (K === 'Escape') drawer(false);
    else return false;
    return true;
  }
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) { if (e.key === 'Escape') e.target.blur(); return; }
    if ((e.key === ' ' || e.key === 'Enter') && ['BUTTON', 'SUMMARY', 'A'].includes(tag)) return;
    if (e.key.toLowerCase() === 'f') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
    if (AUD && window.opener && !window.opener.closed) {
      const nav = ['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter', 'ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'Home', 'End', 'a', 'A', 'r', 'R', 'z', 'Z'];
      if (nav.includes(e.key)) { e.preventDefault(); window.opener.postMessage({ t: 'key', k: e.key }, '*'); }
      return;
    }
    if (key(e.key)) e.preventDefault();
  });

  if (AUD) { show((parseInt(location.hash.slice(1)) || 1) - 1); fitAll(); return; }

  // ---------- 以下只有講者畫面 ----------
  function drawer(target) {
    const d = $('#drawer'), open = target === false ? false : (typeof target === 'string' ? true : !d.classList.contains('open'));
    d.classList.toggle('open', open); d.setAttribute('aria-hidden', !open);
    if (open && typeof target === 'string') lib(target).scrollIntoView();
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (b && b.classList.contains('copy')) {
      let text;
      if (b.dataset.pack) text = document.querySelector(`#library pre.pack[data-pack="${b.dataset.pack}"]`).textContent;
      else { let el = b.previousElementSibling; while (el && !el.classList.contains('say')) el = el.previousElementSibling; text = el ? el.textContent : ''; }
      const ok = await copy(text), old = b.dataset.label || (b.dataset.label = b.textContent);
      b.classList.add(ok ? 'ok' : 'bad'); b.textContent = ok ? '已複製 ✓' : '複製失敗，請手動選取';
      setTimeout(() => { b.classList.remove('ok', 'bad'); b.textContent = old; }, 1600);
      if (ok) toast('已複製，到 AI 視窗按 Ctrl+V');
    } else if (b && b.classList.contains('jump')) jump(+b.dataset.jump);
    else if (!b && e.target.closest('.steps > li') && !e.target.closest('a,summary,input')) e.target.closest('.steps > li').classList.toggle('done');
    if (b) b.blur();
  });

  // 跳頁選單
  const sel = $('#jumpSel');
  sel.innerHTML = slides.map((s, i) => `<option value="${i}">${i + 1}｜${s.dataset.title.slice(0, 18)}</option>`).join('');
  sel.onchange = () => { const v = +sel.value; sel.blur(); v > MAIN_LAST ? jump(v + 1) : show(v); };

  $('#btnPrev').onclick = () => go(-1);
  $('#btnNext').onclick = () => go(1);
  $('#btnFsDown').onclick = () => setFs(fs - 2);
  $('#btnFsUp').onclick = () => setFs(fs + 2);
  $('#btnReturn').onclick = back;
  $('#btnAud').onclick = openAud;
  $('#btnSolo').onclick = () => key('n');
  $('#btnData').onclick = () => drawer();
  $('#btnCheck').onclick = () => drawer('lib-check');
  $('#btnClose').onclick = () => drawer(false);
  $('#btnPrint').onclick = () => print();
  $('#toc').addEventListener('click', e => { const a = e.target.closest('a'); if (a) { e.preventDefault(); lib(a.getAttribute('href').slice(1)).scrollIntoView(); } });

  // 開場前檢查的勾選，只存在本機瀏覽器
  const boxes = [...document.querySelectorAll('#lib-check input[type=checkbox]')];
  try { const saved = JSON.parse(localStorage.getItem('zell-1029-check') || '[]'); boxes.forEach((b, i) => b.checked = !!saved[i]); } catch (e) {}
  boxes.forEach(b => b.onchange = () => { try { localStorage.setItem('zell-1029-check', JSON.stringify(boxes.map(x => x.checked))); } catch (e) {} });

  // 列印用：整份講稿＋全部資料
  $('#printAll').innerHTML = '<h1>AI 時代企業行銷策略｜講稿與資料</h1>' +
    slides.map(s => `<div class="pp">${panelHTML(s, true)}</div>`).join('') +
    [...document.querySelectorAll('#library article')].map(a => a.outerHTML.replace(/ id="[^"]*"/, '')).join('');

  addEventListener('hashchange', () => show((parseInt(location.hash.slice(1)) || 1) - 1));
  show((parseInt(location.hash.slice(1)) || 1) - 1);
  fitAll();
})();
</script>
</body>
</html>
